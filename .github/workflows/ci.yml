name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Install pnpm itself (the ubuntu runner image no longer provides
      # corepack/pnpm by default) — must run before setup-node so the
      # `cache: pnpm` step can locate the executable.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src)
        run: pnpm typecheck

      - name: Typecheck (tests)
        run: pnpm typecheck:tests

      - name: Unit tests
        run: pnpm test

      - name: Build both faces
        run: pnpm build

      - name: Remote contract check
        run: node scripts/check-contract.mjs

      - name: Peer dependency audit
        run: pnpm peers check